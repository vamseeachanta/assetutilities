basename: reportgen

# Generate a report with public citation metadata from inline sections.
# No private standards content is resolved or reproduced.
# project_root + outputs_path determine where the report is written (relative
# to the repo root when run via `uv run python -m assetutilities <this file>`).
# Output: examples/workflows/reportgen/outputs/sample-report.<timestamp>.out.md

important_paths:
  project_root: "examples/workflows/reportgen"
  inputs_path: "inputs"
  assets_path: "assets"
  outputs_path: "outputs"

report_details:
  name: "AssetUtilities Sample Report"
  client_logo: "client-logo.png"
  project_name: "Demo Project"
  project_num: "0001"
  engineer: "AssetUtilities"
  reviewer: "TBD"
  date: "2026/06/13"
  target_file_stub: "sample-report"
  target_report_type: "md"
  # target_report_type: "html"  # Self-contained HTML output is also supported.
  # timestamped_filename: false  # Deterministic basename when explicitly selected.

# NIST SP 811 (2008), section 4.3, table 5, public SI prefix reference.
references:
  - code_id: NIST-SP-811
    publisher: NIST
    revision: "2008"
    source_sibling: generic

sections_L1:
  - name: "Overview"
    paragraphs:
      - ["This is a sample report generated by the reportgen workflow."]
      - ["Sections and paragraphs are declared inline in the input YAML."]

  - name: "Revision history"
    paragraphs:
      - [{type: markdown_table, content: "| Revision | Date | What changed and why |\n|---|---|---|\n| 1 | 2026-10-20 | Added synthetic arithmetic and public citation metadata. |"}]

  - name: "Results"
    paragraphs:
      - ["A markdown table can be embedded directly:"]
      - [{ "type": "markdown_table",
            "content": "| metric | value |\n|---|---|\n| count | 42 |\n| status | green |" }]
      # Independent arithmetic: milli denotes the SI prefix; 1000 mm = 1.0 m.
      - ["Synthetic input: 1000 mm. Method: convert the SI prefix. Answer: 1.0 m."]
      - [{type: citation, code_id: NIST-SP-811, section: "4.3, table 5"}]

  - name: "Appendix"
    sections_L2:
      - name: "Notes"
        paragraphs:
          - ["Generated as part of the workflow registry examples."]
