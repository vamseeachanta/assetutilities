basename: reportgen

# Generate a Markdown report with document-local standard citation bindings.
# Revisions below are metadata from the issue #79 example, not design criteria.
# No standard text or engineering coefficients are included.
# project_root + outputs_path determine where the report is written (relative
# to the repo root when run via `uv run python -m assetutilities <this file>`).
# Output: examples/workflows/reportgen/outputs/sample-report.<timestamp>.out.md

important_paths:
  project_root: "examples/workflows/reportgen"
  inputs_path: "inputs"
  assets_path: "assets"
  outputs_path: "outputs"

report_details:
  name: "AssetUtilities Sample Report"
  client_logo: "client-logo.png"
  project_name: "Demo Project"
  project_num: "0001"
  engineer: "AssetUtilities"
  reviewer: "TBD"
  date: "2026/06/13"
  target_file_stub: "sample-report"
  target_report_type: "md"
  # target_report_type: html  # self-contained single-file HTML
  # timestamped_filename: false  # optional stable output name

references:
  - code_id: DNV-OS-E301
    publisher: DNV
    revision: "2018-07"
  - code_id: OCIMF-MEG4
    publisher: OCIMF
    revision: "2018"

sections_L1:
  - name: "Overview"
    paragraphs:
      - ["This is a sample report generated by the reportgen workflow."]
      - ["Sections and paragraphs are declared inline in the input YAML."]

  - name: "Revision history"
    paragraphs:
      - [{ "type": "markdown_table",
            "content": "| Revision | Date | What changed and why |\n|---|---|---|\n| A | 2026-10-19 | Added citation metadata to demonstrate reference binding. |" }]

  - name: "Inputs and method"
    paragraphs:
      - ["Inputs: two declared standard identifiers and their revisions. Method: look up each citation identifier in references and render its bound revision. This is a formatting example; no engineering calculation is performed."]

  - name: "Results"
    paragraphs:
      - [{ "type": "citation", "code_id": "DNV-OS-E301" }]
      - [{ "type": "citation", "code_id": "OCIMF-MEG4" }]
      - ["Answer: both citation identifiers bind to the declared revisions. No clause or page is asserted without a checked source."]
      - ["A markdown table can be embedded directly:"]
      - [{ "type": "markdown_table",
            "content": "| metric | value |\n|---|---|\n| count | 42 |\n| status | green |" }]

  - name: "Appendix"
    sections_L2:
      - name: "Notes"
        paragraphs:
          - ["Generated as part of the workflow registry examples."]
