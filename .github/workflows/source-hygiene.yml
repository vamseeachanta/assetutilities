name: Source Hygiene

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-hygiene:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run source hygiene gate
        run: bash scripts/hygiene/check-source-hygiene.sh

      - name: Scan pull request commits for secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d "${RUNNER_TEMP}/secret-scan.XXXXXX")
          release=https://github.com/gitleaks/gitleaks/releases/download/v8.21.2
          archive=gitleaks_8.21.2_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            "${release}/${archive}" -o "${scan_dir}/${archive}"
          curl --fail --silent --show-error --location \
            "${release}/gitleaks_8.21.2_checksums.txt" -o "${scan_dir}/checksums.txt"
          (
            cd "$scan_dir"
            grep " ${archive}$" checksums.txt | sha256sum --check --strict
            tar -xzf "$archive" gitleaks
          )
          test "$("${scan_dir}/gitleaks" version)" = "8.21.2"
          "${scan_dir}/gitleaks" git . --config .gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --no-banner
