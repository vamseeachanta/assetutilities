name: PDF integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pdf-integration:
    name: PDF integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install LibreOffice Writer and Liberation Sans
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreoffice-writer fonts-liberation

      - name: Install dependencies
        run: uv sync --group test

      - name: Run Word output and converter unit tests
        run: uv run python -m pytest tests/modules/reportgen/test_standard_report.py -q -p no:cacheprovider

      - name: Run PDF integration test
        run: uv run python -m pytest tests/modules/reportgen/test_standard_report.py -q -p no:cacheprovider -m pdf_integration
