name: Tests

on:
  push:
    branches: [main]
  pull_request:
    # All edits rerun gates: conditional skips could mask an earlier failure.
    # Retargeting needs a fresh merge against the new base, not an old run retry.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ----------------------------------------------------- non-test gates ------
  # Source hygiene, repo-structure contract, and the wheel-package-data guard
  # (assetutilities#88). These ran as steps inside the old monolithic "Run
  # Tests" job; they are now their own job and feed the aggregate gate below so
  # they keep gating without coupling to the per-domain test fan-out.
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - name: Resolve merge against event base
        id: resolve_merge
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          sha=unavailable
          parent=unavailable
          for attempt in $(seq 1 10); do
            sha=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.merge_commit_sha')
            if [[ -n "$sha" && "$sha" != null ]]; then
              parent=$(gh api "repos/$REPOSITORY/commits/$sha" --jq '.parents[0].sha')
              if [[ "$parent" == "$BASE_SHA" ]]; then
                echo "sha=$sha" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if [[ "$attempt" -lt 10 ]]; then
              sleep 6
            fi
          done
          echo "::error::Merge $sha first parent $parent differs from event base $BASE_SHA"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_merge.outputs.sha || github.sha }}

      - name: Guard tested merge base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          tested=$(git rev-parse HEAD)
          parent=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          tree=$(git rev-parse 'HEAD^{tree}')
          if [[ "$parent" != "$BASE_SHA" ]]; then
            echo "::error::Tested $tested first parent $parent differs from event base $BASE_SHA"
            exit 1
          fi
          echo "tested=$tested first_parent=$parent base=$BASE_SHA tree=$tree"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group test

      - name: Test workflow triggers
        run: uv run python -m pytest tests/workflows/test_ci_triggers.py

      - name: Run source hygiene gate
        run: bash scripts/hygiene/check-source-hygiene.sh

      - name: Run repo-structure contract gate
        run: uv run python scripts/maintenance/verify_repo_structure.py

      - name: Verify base_configs ship in the wheel (assetutilities#88 guard)
        run: |
          uv build --wheel --out-dir dist_check
          uv run python scripts/maintenance/check_wheel_package_data.py dist_check

  # --------------------------------------------------- domain test matrix ----
  # Modular per-domain test gate. The discover -> test-domain (matrix) ->
  # aggregate scaffolding now lives ONCE in workspace-hub's reusable
  # domain-matrix.yml (worldenergydata#526 / #530, P4); this caller just wires
  # it up. assetutilities keeps its OWN repo-specific selector
  # (scripts/ci/select_test_targets.py) + quarantine list
  # (scripts/ci/quarantine.txt) — the reusable workflow runs them. A change
  # fans out into one CI job per touched domain (+ the always-on cross-cutting
  # core), so a red domain no longer blocks green siblings and they run in
  # parallel. Both default paths (selector + quarantine-file) already match
  # this repo, so only install-cmd needs an override (--group test, not
  # --all-extras).
  #
  # NOTE: status-check names become "<caller-job>/<reusable-job>", e.g.
  # "domain-tests / Aggregate domain results" — the required check to wire if
  # branch protection is ever enabled (currently unprotected, so the rename is
  # harmless).
  domain-tests:
    uses: vamseeachanta/workspace-hub/.github/workflows/domain-matrix.yml@main
    with:
      install-cmd: "uv sync --group test"
