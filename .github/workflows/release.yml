name: Publish package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# PyPA publishing guide, online edition retrieved 2026-10-20:
# separate unprivileged builds from the OIDC publishing job.
# See docs/sub_release/pypi.md for registration and environment protection.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - name: Build and validate distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release/build.sh . dist "$RELEASE_TAG"
      - name: Verify packaged runtime configurations
        run: python scripts/maintenance/check_wheel_package_data.py dist
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/assetutilities
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
