name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.13.1'
      - name: Check source and tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if [ "$REF_TYPE" = tag ]; then
            python scripts/ci/validate_release.py --tag "$RELEASE_TAG"
          else
            python scripts/ci/validate_release.py
          fi
      - name: Test release contracts
        # pytest 9 removes the path argument used by pytest_ignore_collect
        # in tests/conftest.py; keep the compatible release until it is migrated.
        run: uv run --no-project --with pytest==8.4.2 --with pyyaml==6.0.3 --with pandas==2.3.3 --with plotly==5.24.1 python -m pytest tests/ci
      - name: Build and validate distributions
        run: |
          uv build
          python scripts/ci/validate_release.py --dist dist
          python scripts/maintenance/check_wheel_package_data.py dist
          uv run --no-project --with twine==6.2.0 python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist/
      - name: Publish validated distributions
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
